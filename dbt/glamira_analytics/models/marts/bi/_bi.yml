version: 2

models:
  - name: bi_sales_order_detail
    description: >
      BI-serving view for Looker Studio at one product line per deduplicated
      successful checkout. The view joins the sales fact to reporting
      dimensions while excluding raw PII and preserving Unknown dimension
      members.

    columns:
      - name: sales_order_detail_key
        description: Unique technical key of the sales order detail row.
        data_tests:
          - not_null
          - unique

      - name: checkout_instance_key
        description: Identifier of the deduplicated successful checkout.
        data_tests:
          - not_null

      - name: checkout_date
        description: Calendar date of the successful checkout.
        data_tests:
          - not_null

      - name: order_id
        description: Source business order identifier.
        data_tests:
          - not_null

      - name: line_number
        description: Product-line position within the checkout.
        data_tests:
          - not_null

      - name: product_id
        description: Source product identifier retained for BI analysis.
        data_tests:
          - not_null

      - name: quantity
        description: Source-faithful product quantity for the sales line.
        data_tests:
          - not_null

      - name: store_id
        description: Authoritative source store identifier.
        data_tests:
          - not_null

      - name: is_high_quantity
        description: >
          Quality flag identifying lines with quantity greater than 10.
        data_tests:
          - not_null

      - name: is_missing_currency
        description: >
          Quality flag identifying rows without a resolved currency.
        data_tests:
          - not_null