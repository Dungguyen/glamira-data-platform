version: 2

models:
  - name: dim_customer
    description: >
      Customer dimension containing registered customers observed
      in successful checkout events plus one Unknown Customer member.

    columns:
      - name: customer_key
        description: Deterministic surrogate customer key.
        data_tests:
          - not_null
          - unique

      - name: customer_id_hash
        description: SHA-256 pseudonym of the source customer identifier.
        data_tests:
          - unique

      - name: customer_type
        description: >
          Classification of the customer record, such as REGISTERED
          or UNKNOWN.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - REGISTERED
                  - UNKNOWN

      - name: is_registered
        description: >
          Boolean flag indicating whether the dimension row represents
          a registered customer.
        data_tests:
          - not_null

  - name: dim_product
    description: >
      Product dimension containing enriched Glamira products
      plus one Unknown Product member for unmatched fact rows.

    columns:
      - name: product_key
        description: Deterministic surrogate product key.
        data_tests:
          - not_null
          - unique

      - name: product_id
        description: Natural product identifier from the source.
        data_tests:
          - unique

      - name: product_name
        description: Product name supplied by the product master dataset.
        data_tests:
          - not_null

      - name: category_name
        description: Product category associated with the product master record.
        data_tests:
          - not_null

      - name: is_unknown
        description: >
          Boolean flag identifying the Unknown Product member used when
          a checkout product cannot be matched to the product master.
        data_tests:
          - not_null

  - name: dim_store
    description: >
      Store dimension containing one row per source store_id,
      using the canonical production host as store_domain,
      plus one Unknown Store member.

    columns:
      - name: store_key
        description: Deterministic surrogate store key.
        data_tests:
          - not_null
          - unique

      - name: store_id
        description: Natural store identifier from checkout events.
        data_tests:
          - unique

      - name: store_domain
        description: Canonical production domain associated with the store.
        data_tests:
          - not_null

      - name: is_unknown
        description: >
          Boolean flag identifying the Unknown Store member used for
          unresolved store references.
        data_tests:
          - not_null


  - name: dim_device
    description: >
      Analytical device dimension containing one row per
      device type and screen resolution combination, plus
      one Unknown Device member.

    columns:
      - name: device_key
        description: Deterministic surrogate device key.
        data_tests:
          - not_null
          - unique

      - name: device_type
        description: Analytical device classification.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - MOBILE
                  - DESKTOP
                  - TABLET
                  - BOT
                  - UNKNOWN

      - name: resolution_name
        description: Normalized screen resolution in width x height format.
        data_tests:
          - not_null

      - name: is_bot
        description: Indicates whether the device was classified as a bot.
        data_tests:
          - not_null

      - name: is_unknown
        description: Indicates the Unknown Device dimension member.
        data_tests:
          - not_null

  - name: dim_date
    description: >
      Calendar date dimension covering the complete production checkout
      date range plus one Unknown Date member.

    columns:
      - name: date_key
        description: Calendar smart key in YYYYMMDD format, with 0 reserved for Unknown Date.
        data_tests:
          - not_null
          - unique

      - name: full_date
        description: Calendar date.
        data_tests:
          - unique

      - name: day_name
        description: Full English name of the calendar day of week.
        data_tests:
          - not_null

      - name: month_name
        description: Full English name of the calendar month.
        data_tests:
          - not_null

      - name: year_month
        description: Calendar year and month represented in YYYY-MM format.
        data_tests:
          - not_null

      - name: quarter_name
        description: Calendar quarter label such as Q1, Q2, Q3 or Q4.
        data_tests:
          - not_null

      - name: is_weekend
        description: >
          Boolean flag indicating whether the calendar date falls on
          Saturday or Sunday.
        data_tests:
          - not_null

      - name: is_unknown
        description: >
          Boolean flag identifying the Unknown Date member used for
          unresolved dimension references.
        data_tests:
          - not_null

  - name: dim_geo
    description: >
      Analytical geography dimension containing distinct observed
      production country, region and city combinations plus one
      Unknown Geography member.

    columns:
      - name: geo_key
        description: Deterministic surrogate geography key.
        data_tests:
          - not_null
          - unique

      - name: country_name
        description: Country name or Unknown for the unknown member.
        data_tests:
          - not_null

      - name: geo_level
        description: Most detailed geographical level available.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - CITY
                  - REGION
                  - COUNTRY
                  - UNKNOWN

      - name: is_unknown
        description: >
          Boolean flag identifying the Unknown Geography member used
          when geographic information cannot be resolved.
        data_tests:
          - not_null