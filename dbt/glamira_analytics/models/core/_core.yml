version: 2

models:
  - name: int_checkout_deduplicated
    description: >
      Deduplicated successful checkout business instances.
      Duplicate tracking events are collapsed using order_id,
      store_id and cart_hash, with production events preferred
      over non-production tracking contexts.

    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null

      - name: store_id
        data_tests:
          - not_null

      - name: cart_hash
        data_tests:
          - not_null

      - name: cart_products
        data_tests:
          - not_null

      - name: checkout_environment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PRODUCTION
                  - STAGE
                  - DEV
                  - LOCAL

  - name: int_sales_order_lines
    description: >
      Product-line representation of deduplicated checkout
      instances. Cart products are unnested and line-level
      quantities, prices, currencies and options are normalized.

    columns:
      - name: sales_order_line_key
        data_tests:
          - not_null
          - unique

      - name: checkout_instance_key
        data_tests:
          - not_null

      - name: source_event_id
        data_tests:
          - not_null

      - name: order_id
        data_tests:
          - not_null

      - name: store_id
        data_tests:
          - not_null

      - name: line_number
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: quantity
        data_tests:
          - not_null

      - name: price_format
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - MISSING
                  - APOSTROPHE_THOUSANDS_DECIMAL_DOT
                  - ARABIC_DECIMAL_SEPARATOR
                  - THOUSANDS_COMMA_INTEGER
                  - INTEGER
                  - DECIMAL_DOT
                  - DECIMAL_COMMA
                  - THOUSANDS_COMMA_DECIMAL_DOT
                  - THOUSANDS_DOT_DECIMAL_COMMA
                  - UNSUPPORTED

      - name: option_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - array
                  - string

      - name: checkout_environment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PRODUCTION
                  - STAGE
                  - DEV
                  - LOCAL