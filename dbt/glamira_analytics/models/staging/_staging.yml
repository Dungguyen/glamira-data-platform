version: 2

models:
  - name: stg_checkout_success
    description: >
      Parsed staging representation of raw checkout_success events.
      This model preserves all checkout environments and does not
      perform business-event deduplication.

    columns:
      - name: event_id
        description: Source event identifier.
        data_tests:
          - not_null
          - unique

      - name: event_timestamp
        data_tests:
          - not_null

      - name: order_id
        description: Source order identifier. Not globally unique.
        data_tests:
          - not_null

      - name: store_id
        data_tests:
          - not_null

      - name: cart_products
        data_tests:
          - not_null

      - name: cart_product_count
        data_tests:
          - not_null

      - name: checkout_environment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PRODUCTION
                  - STAGE
                  - DEV
                  - LOCAL
                  - UNKNOWN

      - name: device_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - MOBILE
                  - DESKTOP
                  - TABLET
                  - BOT
                  - UNKNOWN

  - name: stg_products
    description: >
      Normalized staging model containing successfully enriched
      product reference records.

    columns:
      - name: product_id
        description: Natural product identifier from the source.
        data_tests:
          - not_null
          - unique

      - name: product_master_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ENRICHED

      - name: is_enriched
        data_tests:
          - not_null

  - name: stg_geoip
    description: >
      Normalized IP geolocation reference data used to resolve
      checkout IP addresses into geographic attributes.

    columns:
      - name: ip_address
        description: Natural IP lookup key.
        data_tests:
          - not_null
          - unique

      - name: ip_version
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 4
                  - 6
                quote: false

      - name: geo_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - FOUND
                  - ADDRESS_NOT_FOUND
                  - NON_GLOBAL
                  - INVALID

      - name: latitude
        description: Geographic latitude when available.

        description: Geographic longitude when available.

      - name: geo_status
        description: Source GeoIP lookup status.