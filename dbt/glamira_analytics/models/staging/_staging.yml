version: 2

models:
  - name: stg_checkout_success
    description: >
      Parsed staging representation of raw checkout_success events.
      This model preserves all checkout environments and does not
      perform business-event deduplication.

    columns:
      - name: event_id
        description: Source event identifier.
        data_tests:
          - not_null
          - unique

      - name: event_timestamp
        data_tests:
          - not_null

      - name: order_id
        description: Source order identifier. Not globally unique.
        data_tests:
          - not_null

      - name: customer_id
        description: Persistent customer identifier from the source.
        policy_tags:
          - projects/glamira-pipeline-506706/locations/asia-southeast1/taxonomies/3019220019474089968/policyTags/6348636645518110315

      - name: store_id
        data_tests:
          - not_null

      - name: email_address
        description: Customer email address from the source event.
        policy_tags:
          - projects/glamira-pipeline-506706/locations/asia-southeast1/taxonomies/3019220019474089968/policyTags/4890490406766586098

      - name: ip_address
        description: Source IP address associated with the checkout event.
        policy_tags:
          - projects/glamira-pipeline-506706/locations/asia-southeast1/taxonomies/3019220019474089968/policyTags/5361116927825558873

      - name: current_url
        description: URL being visited when the checkout event was recorded.
        policy_tags:
          - projects/glamira-pipeline-506706/locations/asia-southeast1/taxonomies/3019220019474089968/policyTags/1485717519343638640

      - name: referrer_url
        description: Referrer URL associated with the checkout event.
        policy_tags:
          - projects/glamira-pipeline-506706/locations/asia-southeast1/taxonomies/3019220019474089968/policyTags/1485717519343638640

      - name: device_id
        description: Persistent source device identifier.
        policy_tags:
          - projects/glamira-pipeline-506706/locations/asia-southeast1/taxonomies/3019220019474089968/policyTags/3344699932647334883

      - name: user_agent
        description: Full source user-agent string.
        policy_tags:
          - projects/glamira-pipeline-506706/locations/asia-southeast1/taxonomies/3019220019474089968/policyTags/8757751909258418220

      - name: cart_products
        data_tests:
          - not_null

      - name: cart_product_count
        data_tests:
          - not_null

      - name: checkout_environment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PRODUCTION
                  - STAGE
                  - DEV
                  - LOCAL
                  - UNKNOWN

      - name: device_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - MOBILE
                  - DESKTOP
                  - TABLET
                  - BOT
                  - UNKNOWN

  - name: stg_products
    description: >
      Normalized staging model containing successfully enriched
      product reference records.

    columns:
      - name: product_id
        description: Natural product identifier from the source.
        data_tests:
          - not_null
          - unique

      - name: product_master_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ENRICHED

      - name: is_enriched
        data_tests:
          - not_null

  - name: stg_geoip
    description: >
      Normalized IP geolocation reference data used to resolve
      checkout IP addresses into geographic attributes.

    columns:
      - name: ip_address
        description: Natural IP lookup key.
        policy_tags:
          - projects/glamira-pipeline-506706/locations/asia-southeast1/taxonomies/3019220019474089968/policyTags/5361116927825558873
        data_tests:
          - not_null
          - unique

      - name: ip_version
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 4
                  - 6
                quote: false

      - name: geo_status
        description: >
          Source GeoIP lookup status indicating whether the lookup
          was successful or why geolocation was unavailable.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - FOUND
                  - ADDRESS_NOT_FOUND
                  - NON_GLOBAL
                  - INVALID

      - name: latitude
        description: Geographic latitude when available.

      - name: longitude
        description: Geographic longitude when available.